name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC (manual)
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

          echo "=== Token Claims ==="
          echo "$OIDC_TOKEN" | python3 -c "import sys,json,base64; t=sys.stdin.read().strip().split('.'); p=t[1]+'='*(-len(t[1])%4); print(json.dumps(json.loads(base64.b64decode(p)),indent=2))"

          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${{ vars.AWS_ROLE_ARN }}" \
            --role-session-name github-actions-deploy \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json)

          ACCESS_KEY=$(echo "$CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['AccessKeyId'])")
          SECRET_KEY=$(echo "$CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['SecretAccessKey'])")
          SESSION_TOKEN=$(echo "$CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['SessionToken'])")

          echo "::add-mask::$ACCESS_KEY"
          echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$SESSION_TOKEN"

          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$SESSION_TOKEN" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & deploy rexony-orders
        working-directory: lambda/rexony_orders
        run: |
          npm ci
          zip -r ../../orders.zip .
          aws lambda update-function-code \
            --function-name rexony-orders \
            --zip-file fileb://../../orders.zip

      - name: Install & deploy rexony-payment
        working-directory: lambda/rexony_payment
        run: |
          npm ci
          zip -r ../../payment.zip .
          aws lambda update-function-code \
            --function-name rexony-payment \
            --zip-file fileb://../../payment.zip

      - name: Smoke test - orders
        run: |
          STATUS=$(aws lambda invoke \
            --function-name rexony-orders \
            --payload '{"httpMethod":"GET","resource":"/admin/orders","requestContext":{"authorizer":{"claims":{"sub":"ci-test"}}}}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/out.json \
            --query 'StatusCode' --output text)
          echo "Orders Lambda status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Smoke test - products
        run: |
          STATUS=$(aws lambda invoke \
            --function-name rexony-products \
            --payload '{"httpMethod":"GET","resource":"/products","queryStringParameters":{}}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/out2.json \
            --query 'StatusCode' --output text)
          echo "Products Lambda status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1