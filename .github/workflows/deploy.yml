name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo $TOKEN | python3 -c "
          import sys,json,base64
          t=json.load(sys.stdin)['value'].split('.')[1]
          t+='='*(-len(t)%4)
          print(json.dumps(json.loads(base64.b64decode(t)),indent=2))
          "

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & deploy rexony-orders
        working-directory: lambda/rexony_orders
        run: |
          npm ci
          zip -r ../../orders.zip .
          aws lambda update-function-code \
            --function-name rexony-orders \
            --zip-file fileb://../../orders.zip

      - name: Install & deploy rexony-payment
        working-directory: lambda/rexony_payment
        run: |
          npm ci
          zip -r ../../payment.zip .
          aws lambda update-function-code \
            --function-name rexony-payment \
            --zip-file fileb://../../payment.zip

      - name: Smoke test - orders
        run: |
          STATUS=$(aws lambda invoke \
            --function-name rexony-orders \
            --payload '{"httpMethod":"GET","resource":"/admin/orders","requestContext":{"authorizer":{"claims":{"sub":"ci-test"}}}}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/out.json \
            --query 'StatusCode' --output text)
          echo "Orders Lambda status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Smoke test - products
        run: |
          STATUS=$(aws lambda invoke \
            --function-name rexony-products \
            --payload '{"httpMethod":"GET","resource":"/products","queryStringParameters":{}}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/out2.json \
            --query 'StatusCode' --output text)
          echo "Products Lambda status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
